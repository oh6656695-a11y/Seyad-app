<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة صيّاد - حمايتك من النصب الاحتيال</title>
    <meta name="google-site-verification" content="yQSAQq5zo1oSdDkT_nDDmKjFmyEOd_BMmaRCedTfIVs" />
    
    <!-- استدعاء مكتبات فايربيس السحابية -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            text-align: right;
            direction: rtl;
        }

        header {
            background-color: #0f172a;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .admin-btn {
            background-color: #e11d48;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .search-section {
            text-align: center;
        }

        .search-input {
            width: 70%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 5px;
        }

        .search-btn {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #0f172a;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }

        .danger {
            background-color: #ffe6e6;
            color: #990000;
            border: 1px solid #ff9999;
        }

        .safe {
            background-color: #e6ffe6;
            color: #006600;
            border: 1px solid #99ff99;
        }

        .card {
            background: #f8fafc;
            padding: 15px;
            margin-top: 15px;
            border-right: 4px solid #0f172a;
            border-radius: 4px;
        }

        /* نافذة الأدمن */
        #adminModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-body {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🎯 منصة صيّاد</div>
        <button class="admin-btn" onclick="openAdmin()">🔐 لوحة الأدمن</button>
    </header>

    <div class="container">
        <div class="search-section">
            <h2>فحص أرقام النصابين والمحتالين</h2>
            <input type="text" id="phoneInput" class="search-input" placeholder="ادخل الرقم هنا...">
            <button class="search-btn" onclick="checkPhone()">فحص</button>
            <div id="result" class="result-box"></div>
        </div>

        <hr style="margin: 30px 0;">

        <h3>💡 نصائح للأمان</h3>
        <div id="advicesList">جاري تحميل النصائح...</div>

        <hr style="margin: 30px 0;">

        <div style="background: #0f172a; color: white; padding: 20px; border-radius: 8px;">
            <h3>هل تعرضت لعملية نصب؟</h3>
            <p>تواصل مع المطور المهندس: <strong>محمد هاني فؤاد</strong></p>
            <p>هاتف / واتساب: <strong>01284652810</strong></p>
            <a href="https://wa.me/201284652810" target="_blank" style="color: #38bdf8; font-weight: bold;">اضغط هنا للتواصل عبر واتساب مباشر</a>
        </div>
    </div>

    <!-- نافذة الأدمن -->
    <div id="adminModal">
        <div class="modal-body">
            <button onclick="closeAdmin()" style="float: left; background: red; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px;">X</button>
            
            <div id="loginStep">
                <h3>دخول الأدمن</h3>
                <input type="password" id="passInput" placeholder="ادخل الباسورد">
                <button onclick="login()" class="admin-btn" style="width: 100%; margin-top: 10px;">دخول</button>
            </div>

            <div id="controlStep" style="display: none;">
                <h3 style="color: green;">مرحباً بك في لوحة التحكم</h3>
                
                <h4>إضافة رقم نصاب:</h4>
                <input type="text" id="scamPhone" placeholder="الرقم">
                <input type="text" id="scamName" placeholder="الاسم/الصفحة">
                <textarea id="scamDetails" placeholder="تفاصيل النصب"></textarea>
                <button onclick="addScammer()" class="search-btn" style="width: 100%;">حفظ الرقم في الفايربيس</button>

                <hr style="margin: 20px 0;">

                <h4>إضافة نصيحة أمان:</h4>
                <input type="text" id="advTitle" placeholder="عنوان النصيحة">
                <textarea id="advText" placeholder="محتوى النصيحة"></textarea>
                <button onclick="addAdvice()" class="admin-btn" style="width: 100%;">حفظ النصيحة في الفايربيس</button>
            </div>
        </div>
    </div>

    <script>
        // إعدادات الاتصال بقاعدة بيانات الفايربيس الحية
        const firebaseConfig = {
            databaseURL: "https://seyad-app-default-rtdb.firebaseio.com/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        const PASS = "#$22558800";

        function openAdmin() {
            document.getElementById('adminModal').style.display = "flex";
        }

        function closeAdmin() {
            document.getElementById('adminModal').style.display = "none";
            document.getElementById('loginStep').style.display = "block";
            document.getElementById('controlStep').style.display = "none";
            document.getElementById('passInput').value = "";
        }

        function login() {
            let p = document.getElementById('passInput').value;
            if (p === PASS) {
                document.getElementById('loginStep').style.display = "none";
                document.getElementById('controlStep').style.display = "block";
            } else {
                alert("كلمة المرور غير صحيحة!");
            }
        }

        // دالة حفظ الأرقام في الفايربيس
        function addScammer() {
            let phone = document.getElementById('scamPhone').value.trim();
            let name = document.getElementById('scamName').value.trim();
            let details = document.getElementById('scamDetails').value.trim();

            if (!phone) {
                alert("يرجى إدخال رقم الهاتف على الأقل!");
                return;
            }

            database.ref('scammers/' + phone).set({
                phone: phone,
                name: name || "غير معروف",
                details: details || "",
                timestamp: Date.now()
            }).then(() => {
                alert("تمت إضافة الرقم بنجاح في قاعدة البيانات!");
                document.getElementById('scamPhone').value = "";
                document.getElementById('scamName').value = "";
                document.getElementById('scamDetails').value = "";
            }).catch((error) => {
                alert("حدث خطأ أثناء الإضافة: " + error.message);
            });
        }

        // دالة حفظ النصائح في الفايربيس
        function addAdvice() {
            let title = document.getElementById('advTitle').value.trim();
            let text = document.getElementById('advText').value.trim();

            if (!title || !text) {
                alert("يرجى إدخال عنوان ومحتوى النصيحة!");
                return;
            }

            let newAdviceRef = database.ref('advices').push();
            newAdviceRef.set({
                title: title,
                text: text,
                timestamp: Date.now()
            }).then(() => {
                alert("تمت إضافة النصيحة بنجاح!");
                document.getElementById('advTitle').value = "";
                document.getElementById('advText').value = "";
            }).catch((error) => {
                alert("حدث خطأ أثناء حفظ النصيحة: " + error.message);
            });
        }

        // دالة جلب وعرض النصائح تلقائياً من الفايربيس
        function loadAdvices() {
            database.ref('advices').on('value', (snapshot) => {
                let advicesListDiv = document.getElementById('advicesList');
                let html = "";
                
                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        let adv = childSnapshot.val();
                        html += `<div class="card"><strong>${adv.title}</strong><p>${adv.text}</p></div>`;
                    });
                    advicesListDiv.innerHTML = html;
                } else {
                    advicesListDiv.innerHTML = "<p>لا توجد نصائح مضافة حالياً.</p>";
                }
            });
        }

        // دالة فحص الرقم بالبحث في الفايربيس مباشرة
        function checkPhone() {
            let num = document.getElementById('phoneInput').value.trim();
            let res = document.getElementById('result');
            
            if(!num) {
                alert("اكتب الرقم الأول لفحصه!");
                return;
            }

            database.ref('scammers/' + num).once('value').then((snapshot) => {
                res.style.display = "block";
                if (snapshot.exists()) {
                    let data = snapshot.val();
                    res.className = "result-box danger";
                    res.innerHTML = `⚠️ <strong>احذر! هذا الرقم مسجل كنصاب</strong><br>الاسم: ${data.name}<br>التفاصيل: ${data.details}`;
                } else {
                    res.className = "result-box safe";
                    res.innerHTML = `✅ <strong>هذا الرقم غير مسجل في قائمة النصب</strong><br>إذا كان محتالاً، تواصل مع المهندس محمد لإضافته: <a href="https://wa.me/201284652810?text=ابلاغ عن الرقم: ${num}" target="_blank">إبلاغ عبر واتساب</a>`;
                }
            }).catch((error) => {
                alert("حدث خطأ أثناء البحث: " + error.message);
            });
        }

        // تشغيل تحميل النصائح فور فتح الصفحة
        window.onload = function() {
            loadAdvices();
        };
    </script>
</body>
</html>
